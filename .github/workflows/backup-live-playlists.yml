name: Back up individual TVBox live playlists

on:
  push:
    branches: [main]
    paths:
      - 'sources/configs/vod/**'
      - 'sources/live/**'
      - 'sources/vod/**'
      - 'tools/backup_live_playlists.py'
      - 'tools/test_live_playlist_backup.py'
      - '.github/workflows/backup-live-playlists.yml'
  schedule:
    - cron: "50 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tvbox-repo-maintenance
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test live playlist backup
        run: |
          cd tools
          python -m unittest test_live_playlist_backup.py
          cd ..
      - name: Download individual live playlists
        env:
          LIVE_BACKUP_WORKERS: 5
        run: python3 tools/backup_live_playlists.py
      - name: Commit playlist backups and index
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No live playlist backup changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- sources/collected/live_backups/ sources/collected/直播源聚合.json output/reports/live_backup_report.json
          git commit -m "Back up individual TVBox live playlists"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another repository update; retrying ($attempt/3)."
            sleep 2
          done
          echo "Could not push live playlist backups after 3 attempts."
          exit 1
