name: Maintain JSON sources in this repository

on:
  schedule:
    # 每天 UTC 02:30（北京时间 10:30）
    - cron: '30 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/maintain_local_json.py"
      - "tools/source_pipeline.py"
      - "tools/localize_tvbox_configs.py"
      - "tools/test_config_localizer.py"
      - "tools/test_source_pipeline.py"
      - "tools/fetch_util.py"
      - "requirements.txt"
      - "rylinks.txt"
      - "apilinks.txt"
      - "tools/api_link_catalog.py"
      - "tools/api_pagination.py"
      - "tools/refresh_api_catalog.py"
      - "tools/test_api_link_catalog.py"
      - "tools/refresh_online_packages.py"
      - "tools/test_online_package_refresh.py"
      - "tools/live_stream_health.py"
      - "tools/test_live_stream_health.py"
      - "tools/build_resource_catalog.py"
      - "tools/test_resource_catalog.py"
      - "tools/import_config_zip.py"
      - "tools/test_config_zip_import.py"
      - "sources/configs/vod/**"
      - "sources/live/**"
      - "sources/vod/**"
      - ".github/workflows/maintain-local-json.yml"

permissions:
  contents: write

concurrency:
  group: tvbox-repo-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run source pipeline unit tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Audit and safely repair local JSON files
        run: python3 tools/maintain_local_json.py
      - name: Build local auxiliary resource inventory
        run: python3 tools/build_resource_catalog.py
      - name: Build source catalog, fetch API snapshots and aggregate playlists
        run: python3 tools/source_pipeline.py --workers 5
      - name: Build localized TVBox configurations and owned dependencies
        run: python3 tools/localize_tvbox_configs.py
      - name: Commit maintenance results
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No JSON repairs or report changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Maintain local JSON sources"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another repository update; retrying ($attempt/3)."
            sleep 2
          done
          echo "Could not push maintenance commit after 3 attempts."
          exit 1
