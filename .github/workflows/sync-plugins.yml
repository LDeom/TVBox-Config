name: Sync upstream TVBox plugins and configs

on:
  push:
    branches: [main]
    paths:
      - "tools/sync_plugins.py"
      - ".github/workflows/sync-plugins.yml"
  workflow_dispatch:
  schedule:
    # 每天 UTC 02:30（北京时间 10:30）自动同步上游
    - cron: '30 2 * * *'

permissions:
  contents: write

concurrency:
  group: sync-tvbox-plugins
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync plugins and rewrite config references
        run: python3 tools/sync_plugins.py
      - name: Commit imported plugins and rewritten configs
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No plugin or config changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/js sources/jar sources/configs sources/vod output/reports/plugin_dependency_manifest.json
          git commit -m "Use repository-local TVBox plugin references"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
