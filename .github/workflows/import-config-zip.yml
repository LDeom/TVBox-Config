name: Safely import a TVBox ZIP package

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "公开 ZIP 文件直链（只导入到 imports/staging，不会覆盖正式配置）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: tvbox-repo-maintenance
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run safe ZIP validation and isolated import
        id: zip_import
        continue-on-error: true
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: python3 tools/import_config_zip.py --url "$ZIP_URL"
      - name: Commit staged files and import report
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- imports/staging output/reports/zip_import_report.json)" ]; then
            echo "No import output to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- imports/staging output/reports/zip_import_report.json
          git commit -m "Stage validated TVBox ZIP resources"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Mark rejected import as failed
        if: steps.zip_import.outcome == 'failure'
        run: exit 1
