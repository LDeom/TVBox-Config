name: Backup explicit TVBox JSON configurations

on:
  push:
    branches: [main]
    paths:
      - 'apilinks.txt'
      - 'tools/backup_tvbox_configs.py'
      - 'tools/test_tvbox_config_backup.py'
      - '.github/workflows/backup-tvbox-configs.yml'
  schedule:
    - cron: "35 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tvbox-repo-maintenance
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test backup parser and URL normalization
        run: |
          cd tools
          python -m unittest test_tvbox_config_backup.py
          cd ..
      - name: Back up explicit configuration URLs
        run: python3 tools/backup_tvbox_configs.py
      - name: Commit backups and index
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No backup changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- sources/collected/api_backups/ output/history/ output/reports/api_backup_report.json
          git commit -m "Backup explicit TVBox JSON configurations"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another repository update; retrying ($attempt/3)."
            sleep 2
          done
          echo "Could not push config backups after 3 attempts."
          exit 1
