name: Refresh dedicated TVBox API catalog

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "输出每条 API 的详细巡检结果"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tvbox-repo-maintenance
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh API endpoints and mirror recommendations
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            python3 tools/refresh_api_catalog.py --workers 5 --debug
          else
            python3 tools/refresh_api_catalog.py --workers 5
          fi
      - name: Commit API snapshots and reports
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No API catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- sources/collected/ output/history/ output/reports/api_links_report.json
          git commit -m "Refresh dedicated TVBox API catalog"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another repository update; retrying ($attempt/3)."
            sleep 2
          done
          echo "Could not push API refresh after 3 attempts."
          exit 1
